name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Doc tests
        run: cargo test --locked --all-features --doc
      - name: OpenAPI spec up to date
        run: |
          cargo run --locked --all-features --bin deve-sub -- openapi > /tmp/openapi.json
          diff -u /tmp/openapi.json docs/openapi/openapi.json

  docs:
    name: docs-and-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Docs and acceptance checks
        run: python3 scripts/check_docs.py

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t deve-sub:ci .
      - name: Run container and verify health
        run: |
          # Create a named volume so the migrate and serve containers share
          # the same /app/data directory.
          docker volume create deve-sub-ci-data

          # Run migrations in a one-shot container before starting the
          # server. The serve command calls verify_schema and exits if
          # migrations have not been applied, so migrate must run first.
          docker run --rm -v deve-sub-ci-data:/app/data deve-sub:ci \
            migrate --db-path /app/data/deve-sub.db

          # Start the server with the shared volume.
          docker run -d --name deve-sub-test -p 8080:8080 -v deve-sub-ci-data:/app/data deve-sub:ci

          # Poll the Docker healthcheck status until healthy
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' deve-sub-test 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy"
              break
            fi
            echo "Waiting for healthy state (attempt $i: $status)..."
            sleep 1
          done

          if [ "$status" != "healthy" ]; then
            echo "FAIL: container did not become healthy within 30s"
            docker logs deve-sub-test
            exit 1
          fi

          # Verify both health endpoints
          curl -sf http://localhost:8080/health/live
          curl -sf http://localhost:8080/health/ready

          # Verify non-root user
          uid=$(docker exec deve-sub-test id -u)
          if [ "$uid" != "1000" ]; then
            echo "FAIL: container runs as UID $uid, expected 1000"
            exit 1
          fi
          echo "Container runs as non-root user (UID 1000)"
      - name: Cleanup
        if: always()
        run: |
          docker stop deve-sub-test 2>/dev/null || true
          docker rm deve-sub-test 2>/dev/null || true
          docker volume rm deve-sub-ci-data 2>/dev/null || true

  # Multi-arch build verification (DEPLOY-003/004).
  # Runs only on push to main (not PRs) because arm64 via QEMU is slow.
  multiarch:
    name: multiarch (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: rust
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch images (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: deve-sub:multiarch
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify amd64 image boots and healthcheck passes
        run: |
          docker build -t deve-sub-amd64 --platform linux/amd64 .
          docker volume create deve-sub-ma-amd64
          docker run --rm -v deve-sub-ma-amd64:/app/data --platform linux/amd64 \
            deve-sub-amd64 migrate --db-path /app/data/deve-sub.db
          docker run -d --name deve-sub-ma-amd64 -p 8081:8080 \
            -v deve-sub-ma-amd64:/app/data --platform linux/amd64 deve-sub-amd64
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' deve-sub-ma-amd64 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            echo "FAIL: amd64 container did not become healthy"
            docker logs deve-sub-ma-amd64
            exit 1
          fi
          echo "amd64 healthcheck: healthy (DEPLOY-003/005)"
          docker stop deve-sub-ma-amd64 2>/dev/null || true
          docker rm deve-sub-ma-amd64 2>/dev/null || true
          docker volume rm deve-sub-ma-amd64 2>/dev/null || true
