# Docker Compose for Deve Sub — one-command startup (DEPLOY-001).
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose logs -f        # follow logs
#   docker compose down           # stop and remove
#
# The image entrypoint runs migrations before starting the server, so no
# separate migrate step is needed here. Data is persisted in a named volume.
# The healthcheck uses the internalized `deve-sub health live` command per
# ADR-0006.

services:
  deve-sub:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - deve-sub-data:/app/data
    healthcheck:
      test: ["CMD", "/app/deve-sub", "health", "live"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  deve-sub-data:
