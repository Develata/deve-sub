name: ci

on:
  pull_request:
  push:
    branches: [main]
  # WHY (ADR-0008): nightly full baseline detects drift before a release.
  schedule:
    - cron: "0 19 * * *"
  # Release builds wait for this same complete baseline (DS-AUD-B04).
  workflow_call:
    outputs:
      wasm-manifest-sha256:
        description: Verified frontend producer manifest digest
        value: ${{ jobs.web-wasm.outputs.manifest-sha256 }}

permissions:
  contents: read

# WHY: a shared non-PR group would discard pending main/release baselines even
# with cancel-in-progress=false. Only superseded PR runs share a group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    name: ci-static-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: pip install pyyaml==6.0.3
      - run: python3 -m unittest discover -s scripts/ci/tests
      - run: python3 scripts/tests/test_soak.py
      - run: python3 scripts/tests/test_docker_health_deadline.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-tool
      - run: cargo run --locked -p deve-sub-ci -- inventory

  # WHY (ADR-0008): independent checks and complete package shards run in
  # parallel, retaining the locked/all-targets/all-features test baseline.
  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 scripts/tests/test_architecture.py
      - run: python3 scripts/check_architecture.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # WHY: finish every shard even on failure.
  # Grouping small crates keeps the static matrix within runner capacity.
  test:
    name: test:${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            crates: "-p deve-sub-kernel -p deve-sub-contract -p deve-sub-domain -p deve-sub-web"
          - shard: protocol
            crates: "-p deve-sub-protocol"
          - shard: emitter
            crates: "-p deve-sub-emitter -p deve-sub-compatibility"
          - shard: storage
            crates: "-p deve-sub-storage-sqlite"
          - shard: application
            crates: "-p deve-sub-application"
          - shard: adapters
            crates: "-p deve-sub-adapters"
          - shard: infra
            crates: "-p deve-sub-security -p deve-sub-observability -p deve-sub-inmemory -p deve-sub-ci"
          - shard: server
            crates: "-p deve-sub-server"
          - shard: cli
            crates: "-p deve-sub-cli"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-${{ matrix.shard }}
      - name: Run full Rust shard
        env:
          CI_PACKAGES: ${{ matrix.crates }}
        run: |
          # shellcheck disable=SC2086
          cargo test --locked --all-targets --all-features $CI_PACKAGES

  test-doc:
    name: test-doc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-doc
      - run: cargo test --locked --all-features --doc

  openapi-diff:
    name: openapi-diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: openapi
      - run: |
          cargo run --locked --all-features --bin deve-sub -- openapi > /tmp/openapi.json
          diff -u /tmp/openapi.json docs/openapi/openapi.json

  # WHY: one Rust fan-in blocks downstream consumers on any failed shard.
  # The final acceptance gate checks every required job result.
  rust-gate:
    name: rust-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fmt-check, clippy, test, test-doc, openapi-diff]
    steps:
      - run: echo "All Rust gates passed"

  # WHY (B-19): external validator tests are #[ignore] by default so dev
  # `cargo test` reports them honestly as ignored, not false-positive pass.
  # This job installs the real binaries and runs `--ignored` so the release
  # gate only passes when actual validation occurs.
  compatibility:
    name: compatibility-validators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install checksum-pinned validators
        run: |
          python3 scripts/install-validators.py "$RUNNER_TEMP/validators"
          echo "$RUNNER_TEMP/validators" >> "$GITHUB_PATH"
      - name: Run validator tests
        run: cargo test --locked -p deve-sub-emitter --test out001_mihomo_check --test out003_singbox_check --test out004_xray_check -- --ignored --test-threads=1

  docs:
    name: docs-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.3
      - name: Docs and acceptance checks
        run: python3 scripts/check_docs.py

  web-wasm:
    name: web-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest-sha256: ${{ steps.provenance.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify committed CSS matches source
        run: |
          npm ci --prefix apps/web
          npm run --prefix apps/web build:css
          git diff --exit-code -- apps/web/src/styles/tailwind.css
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - id: tool-image
        run: echo "image-os=${ImageOS:?missing runner image generation}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deve-sub/dioxus
          key: dx-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-image.outputs.image-os }}-rust-1.97.1-dioxus-0.7.10
      - name: Install or verify Dioxus CLI
        run: |
          tool_root="$HOME/.cache/deve-sub/dioxus"
          if [ ! -x "$tool_root/bin/dx" ] || ! timeout 10 "$tool_root/bin/dx" --version | grep -Eq '^dioxus 0[.]7[.]10([[:space:]]|$)'; then
            cargo install dioxus-cli --locked --version 0.7.10 --root "$tool_root" --force
          fi
          timeout 10 "$tool_root/bin/dx" --version | grep -Eq '^dioxus 0[.]7[.]10([[:space:]]|$)'
          echo "$tool_root/bin" >> "$GITHUB_PATH"
      - name: Build and verify WASM frontend
        run: bash scripts/build-web-release.sh
      - id: provenance
        run: |
          python3 scripts/ci/artifact.py create --kind wasm --root apps/web/dist
          echo "manifest-sha256=$(sha256sum apps/web/dist/.ci-artifact.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload WASM dist artifact
        # WHY (ADR-0008, Phase 3-A): browser-e2e reuses this verified build.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-dist
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # WHY (ADR-0008, Phase 3-B): runtime tests share this candidate binary;
  # Docker retains its source build to verify the container build pipeline.
  build-release:
    name: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest-sha256: ${{ steps.provenance.outputs.manifest-sha256 }}
    # Candidate input only: release.yml still gates distribution builds on full CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: build-release
      - run: cargo build --locked --release --bin deve-sub
      - name: Prepare source-bound candidate
        id: provenance
        run: |
          mkdir -p "$RUNNER_TEMP/native-artifact"
          cp target/release/deve-sub "$RUNNER_TEMP/native-artifact/deve-sub"
          python3 scripts/ci/artifact.py create --kind binary --root "$RUNNER_TEMP/native-artifact"
          echo "manifest-sha256=$(sha256sum "$RUNNER_TEMP/native-artifact/.ci-artifact.json" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binary
          path: ${{ runner.temp }}/native-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  resource-soak:
    name: real-application-resource-soak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binary
          path: target/release
      - run: python3 scripts/ci/artifact.py verify --kind binary --root target/release --manifest-sha256 "$MANIFEST_SHA256"
        env:
          MANIFEST_SHA256: ${{ needs.build-release.outputs.manifest-sha256 }}
      - run: chmod +x target/release/deve-sub
      - run: python3 scripts/perf/soak.py --binary target/release/deve-sub --seconds 90 --require-telemetry --output /tmp/soak.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: resource-soak
          path: /tmp/soak.*
          retention-days: 7

  supply-chain:
    name: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-deny
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked check

  browser-e2e:
    name: browser-e2e:${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rust-gate, web-wasm, build-release]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - suite: legacy
            args: "--config playwright.config.ts"
          - suite: functional-api
            args: "--config functional.config.ts --project functional-api --workers 2"
          - suite: functional-desktop
            args: "--config functional.config.ts --project functional-desktop --workers 2"
          - suite: functional-mobile
            args: "--config functional.config.ts --project functional-mobile --workers 2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # WHY (ADR-0008, Phase 3-A/B): consume the exact producer artifacts.
      - name: Download WASM dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-dist
          path: apps/web/dist
      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binary
          path: target/release
      - name: Make binary executable
        env:
          BINARY_MANIFEST_SHA256: ${{ needs.build-release.outputs.manifest-sha256 }}
          WASM_MANIFEST_SHA256: ${{ needs.web-wasm.outputs.manifest-sha256 }}
        run: |
          python3 scripts/ci/artifact.py verify --kind binary --root target/release --manifest-sha256 "$BINARY_MANIFEST_SHA256"
          python3 scripts/ci/artifact.py verify --kind wasm --root apps/web/dist --manifest-sha256 "$WASM_MANIFEST_SHA256"
          chmod +x target/release/deve-sub
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Verify browser process lifecycle
        if: matrix.suite == 'legacy'
        run: npx playwright test --config lifecycle.config.ts
        working-directory: tests/e2e
      - name: Run browser lane
        env:
          CI_BROWSER_ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test $CI_BROWSER_ARGS
        working-directory: tests/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Docker image
        # WHY (ADR-0008, Phase 3-F): share cache reads, isolate cache writers.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: deve-sub:ci
          cache-from: |
            type=gha,scope=docker-ci
            type=gha,scope=multiarch-ci
          cache-to: type=gha,scope=docker-ci,mode=max
      - name: Verify environment administrator bootstrap
        run: python3 scripts/tests/test_docker_bootstrap.py --image deve-sub:ci
      - name: Verify bounded container log rotation
        run: python3 scripts/tests/test_docker_logging.py --image deve-sub:ci
      - name: Verify image architecture, healthcheck and Web runtime
        run: python3 scripts/tests/test_docker_health.py --image deve-sub:ci --platform linux/amd64

  # Multi-arch build verification (DEPLOY-003/004).
  # WHY: runs on push to main and on the nightly schedule, not on PRs.
  # The arm64 runtime stage still needs QEMU for apt-get on
  # debian:trixie-slim; the builder stage uses cross-compile (not QEMU) per
  # Dockerfile line 9 --platform=$BUILDPLATFORM. Schedule inclusion keeps
  # the arm64 GHA Docker layers warm — the docker job reuses this cache and
  # only multiarch writes arm64 layers.
  multiarch:
    name: multiarch (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust-gate
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build multi-arch images (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: deve-sub:multiarch
          cache-from: |
            type=gha,scope=multiarch-ci
            type=gha,scope=docker-ci
          cache-to: type=gha,scope=multiarch-ci,mode=max
      - name: Load amd64 image from cache
        # WHY (Phase 3-C): step 1 already built amd64+arm64 and wrote to GHA
        # cache. Loading from cache avoids a redundant full docker build
        # (the old step did `docker build` from scratch — ~3-5m wasted).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: deve-sub-amd64
          cache-from: type=gha,scope=multiarch-ci
      - name: Load arm64 image from cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: deve-sub-arm64
          cache-from: type=gha,scope=multiarch-ci
      - name: Verify both architectures boot with the real healthcheck
        # WHY: cross-compilation alone cannot prove the ARM64 image starts.
        # Each smoke owns its cleanup; finish both and retain either failure.
        run: |
          status=0
          python3 scripts/tests/test_docker_health.py --image deve-sub-amd64 --platform linux/amd64 || status=1
          python3 scripts/tests/test_docker_health.py --image deve-sub-arm64 --platform linux/arm64 || status=1
          exit "$status"

  acceptance-gate:
    name: acceptance-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [inventory, fmt-check, clippy, test, test-doc, openapi-diff, rust-gate, compatibility, docs, web-wasm, build-release, resource-soak, supply-chain, browser-e2e, docker, multiarch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-tool
          save-if: false
      - name: Require complete full-baseline job results
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: cargo run --locked -p deve-sub-ci -- gate --output "$RUNNER_TEMP/ci-result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-result
          path: ${{ runner.temp }}/ci-result.json
          if-no-files-found: error
          retention-days: 7
