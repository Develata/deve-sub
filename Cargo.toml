[workspace]
members = [
    "crates/deve-sub-kernel",
    "crates/deve-sub-contract",
    "crates/deve-sub-domain",
]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Deve Sub contributors"]
license = "MIT"
repository = "https://github.com/Develata/deve-sub"
homepage = "https://github.com/Develata/deve-sub"

[workspace.dependencies]
# Intra-workspace
deve-sub-kernel = { path = "crates/deve-sub-kernel" }
deve-sub-contract = { path = "crates/deve-sub-contract" }
deve-sub-domain = { path = "crates/deve-sub-domain" }

# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
