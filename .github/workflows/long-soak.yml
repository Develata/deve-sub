name: optional-long-soak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: long-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: long-soak
      - run: cargo build --locked --release --bin deve-sub
      - run: python3 scripts/perf/soak.py --binary target/release/deve-sub --seconds 1800 --require-telemetry --output "$RUNNER_TEMP/long-soak.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: long-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/long-soak.json
          if-no-files-found: error
          retention-days: 90
