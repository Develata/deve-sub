name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Build amd64 binary
        run: cargo build --locked --release --bin deve-sub
      - name: Build arm64 binary
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu --bin deve-sub

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp target/release/deve-sub release/deve-sub-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/deve-sub release/deve-sub-linux-arm64

          cd release
          sha256sum deve-sub-linux-amd64 deve-sub-linux-arm64 > checksums.txt

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output-pattern package
          cp target/deve-sub.cdx.json release/deve-sub-sbom.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/deve-sub-linux-amd64
            release/deve-sub-linux-arm64
            release/checksums.txt
            release/deve-sub-sbom.json

  docker-release:
    name: Multi-arch Docker image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
