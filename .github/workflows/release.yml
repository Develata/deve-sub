name: release

on:
  push:
    tags: ["v*"]

# Minimal global permissions; jobs override as needed (DS-AUD-010).
permissions:
  contents: read

jobs:
  # WHY (DS-AUD-B04): a tag push must pass the full verification suite
  # before any binary is built. Reuses ci.yml (fmt/clippy/test/docs/wasm/
  # e2e/docker) via workflow_call. If any ci job fails, the build job is
  # skipped — no release is published (fail-closed).
  verify:
    name: Verify (ci suite)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # WHY (DS-AUD-B04): the tag name (minus leading `v`) must equal the
  # Cargo version. Prevents tagging v0.2.0 against a worktree that still
  # says 0.1.0, which would publish a binary reporting the wrong version.
  version-check:
    name: Tag == Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag (stripped): $TAG"
          echo "Cargo version:  $CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "FAIL: tag v$TAG does not match Cargo version $CARGO_VERSION"
            exit 1
          fi
          echo "OK: tag matches Cargo version"

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    needs: [verify, version-check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: deve-sub-linux-amd64
            runner: native
          - target: aarch64-unknown-linux-gnu
            asset: deve-sub-linux-arm64
            runner: qemu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # WHY (DS-AUD-B03): the arm64 target needs a cross linker and a C
      # compiler for the `ring` crate (used by rustls/rcgen/quinn), which
      # compiles C/assembly via the `cc` crate. The `cc` crate respects
      # `CC_<target>` env vars. `shadowsocks` is pure Rust; no other C deps.
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install QEMU for arm64 smoke test
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y qemu-user-static

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --locked --release --target ${{ matrix.target }} --bin deve-sub

      # WHY (DS-AUD-B03): prove the cross-compile produced a working binary,
      # not just a linked blob. `--version` verifies the binary runs and is
      # not corrupted; `--help` verifies CLI parsing. Both are pure
      # computation + stdout (no syscalls beyond write/exit), so QEMU
      # user-mode is sufficient. Deeper smoke (doctor/serve) needs a DB+key
      # and is out of scope for the release workflow.
      - name: Smoke test (native amd64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/deve-sub --version
          ./target/${{ matrix.target }}/release/deve-sub --help

      - name: Smoke test (QEMU arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          qemu-aarch64-static ./target/${{ matrix.target }}/release/deve-sub --version
          qemu-aarch64-static ./target/${{ matrix.target }}/release/deve-sub --help

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/deve-sub release/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # WHY: environment gate pauses releases until the repo owner configures
    # the `release` environment with required reviewers (DS-AUD-055). This
    # prevents accidental publishes while Phase B–D fixes are in progress.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum deve-sub-linux-amd64 deve-sub-linux-arm64 > checksums.txt

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output-pattern package
          cp target/deve-sub.cdx.json release/deve-sub-sbom.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/deve-sub-linux-amd64
            release/deve-sub-linux-arm64
            release/checksums.txt
            release/deve-sub-sbom.json

  docker-release:
    name: Multi-arch Docker image
    runs-on: ubuntu-latest
    needs: release
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # WHY: immutable semver tag only — no `latest` (constraint #11,
          # DS-AUD-012). The `latest` tag misleads users into tracking an
          # unversioned, potentially incompatible image.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
