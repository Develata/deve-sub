<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Many sources. One place.</title>
  <desc id="desc">Deve Sub brings subscriptions and configuration files into one node pool, then generates client profiles and subscription URLs.</desc>
