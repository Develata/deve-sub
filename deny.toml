[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
unmaintained = "all"
# paste is a build-time macro dependency of utoipa-axum; no maintained
# compatible upstream replacement is released. Review when upgrading utoipa.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "utoipa-axum depends on paste; compile-time only, reviewed 2026-09-09" }]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0"]

[bans]
# Mature upstream stacks use different RustCrypto/http generations; report
# duplicates without forcing unsafe or costly dependency replacements.
multiple-versions = "warn"
# Workspace path dependencies intentionally have no registry version; Cargo.lock
# pins release builds. Report rather than reject those local wildcard edges.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
