# One-time maintenance job; removed from the proposed patch after Cargo generates Cargo.lock.
name: lockfile-refresh-2026-11-23
on:
  push:
    branches: [fix/rustsec-2026-11-23]
    paths: [.github/workflows/lockfile-refresh-2026-11-23.yml]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Develata/deve-sub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Resolve patched versions using Cargo
        run: |
          set -euo pipefail
          cargo update -p sqlx --precise 0.9.1
          cargo update -p libsqlite3-sys --precise 0.40.0
          cargo update -p quinn-proto --precise 0.11.19
          cargo update -p quinn-udp --precise 0.5.16
          cargo update -p url --precise 2.5.9
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git add Cargo.lock
          git diff --cached --exit-code --quiet && { echo "No Cargo.lock changes generated"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): regenerate patched RustSec dependency lock"
          git push origin HEAD:fix/rustsec-2026-11-23
