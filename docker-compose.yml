# Docker Compose for Deve Sub — one-command startup (DEPLOY-001).
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose logs -f        # follow logs
#   docker compose down           # stop and remove
#
# The compose file runs migrations before starting the server. Data is
# persisted in a named volume. The healthcheck uses the internalized
# `deve-sub health live` command per ADR-0006.

services:
  deve-sub:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - deve-sub-data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /app/deve-sub migrate --db-path /app/data/deve-sub.db
      && exec /app/deve-sub serve --db-path /app/data/deve-sub.db
    healthcheck:
      test: ["CMD", "/app/deve-sub", "health", "live"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  deve-sub-data:
