name: ci

on:
  pull_request:
  push:
    branches: [main]
  # WHY (ADR-0008): nightly full baseline. Keeps GHA caches warm (rust-cache
  # and Docker GHA cache expire after 7 days without use, and the Phase 3
  # job speedups depend on warm caches) and detects CI rot (runner image or
  # action breakages) before a release tag hits the same suite via
  # workflow_call, where a failure would surface at the worst moment.
  schedule:
    - cron: "0 19 * * *"
  # WHY (DS-AUD-B04): callable by release.yml so a tag push must pass the
  # full verification suite (fmt/clippy/test/docs/wasm/e2e/docker) before
  # any binary is built or released.
  workflow_call:

permissions:
  contents: read

jobs:
  # WHY: Phase 1 CI parallelization — the former monolithic `rust` job ran
  # fmt→clippy→test→doc→openapi serially (~6m wall). Splitting into
  # independent jobs lets GitHub Actions run them concurrently, cutting the
  # critical path from ~6m to the slowest shard (~2m). Test coverage is
  # identical: every shard runs `cargo test --all-targets --all-features` on
#   the same crate set, just partitioned by `-p`. See ADR-0008.
  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check_architecture.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # WHY: per-crate test shards. `fail-fast: false` so all shards run to
  # completion even if one fails — gives complete feedback in one cycle
  # instead of cancelling remaining shards on first failure. Shards are
  # grouped by compile boundary + weight: lightweight leaf crates (kernel,
  # contract, domain, security, observability, inmemory) are merged into
  # `core` and `infra` to stay within the 20-concurrent-job GHA limit.
  test:
    name: test:${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            crates: "-p deve-sub-kernel -p deve-sub-contract -p deve-sub-domain"
          - shard: protocol
            crates: "-p deve-sub-protocol"
          - shard: emitter
            crates: "-p deve-sub-emitter -p deve-sub-compatibility"
          - shard: storage
            crates: "-p deve-sub-storage-sqlite"
          - shard: application
            crates: "-p deve-sub-application"
          - shard: adapters
            crates: "-p deve-sub-adapters"
          - shard: infra
            crates: "-p deve-sub-security -p deve-sub-observability -p deve-sub-inmemory"
          - shard: server
            crates: "-p deve-sub-server"
          - shard: cli
            crates: "-p deve-sub-cli"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-${{ matrix.shard }}
      - run: cargo test --locked --all-targets --all-features ${{ matrix.crates }}

  test-doc:
    name: test-doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-doc
      - run: cargo test --locked --all-features --doc

  openapi-diff:
    name: openapi-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: openapi
      - run: |
          cargo run --locked --all-features --bin deve-sub -- openapi > /tmp/openapi.json
          diff -u /tmp/openapi.json docs/openapi/openapi.json

  # WHY: fan-in gate — downstream jobs (browser-e2e, docker, multiarch)
  # depend on this single job instead of enumerating every shard. If any
  # upstream shard fails, GitHub Actions skips this job, which propagates
  # the failure to all downstream consumers (fail-closed).
  rust-gate:
    name: rust-gate
    runs-on: ubuntu-latest
    needs: [fmt-check, clippy, test, test-doc, openapi-diff]
    steps:
      - run: echo "All Rust gates passed"

  # WHY (B-19): external validator tests are #[ignore] by default so dev
  # `cargo test` reports them honestly as ignored, not false-positive pass.
  # This job installs the real binaries and runs `--ignored` so the release
  # gate only passes when actual validation occurs.
  compatibility:
    name: compatibility-validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install checksum-pinned validators
        run: |
          python3 scripts/install-validators.py "$RUNNER_TEMP/validators"
          echo "$RUNNER_TEMP/validators" >> "$GITHUB_PATH"
      - name: Run validator tests
        run: cargo test --locked -p deve-sub-emitter --test out001_mihomo_check --test out003_singbox_check --test out004_xray_check -- --ignored --test-threads=1

  docs:
    name: docs-and-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.3
      - name: Docs and acceptance checks
        run: python3 scripts/check_docs.py

  web-wasm:
    name: web-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked --version 0.7.10
      - name: Build and verify WASM frontend
        run: bash scripts/build-web-release.sh
      - name: Upload WASM dist artifact
        # WHY (Phase 3-A): browser-e2e downloads this instead of rebuilding
        # the WASM frontend, saving ~2m of dioxus install + build time.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-dist
          path: apps/web/dist/
          retention-days: 1

  # WHY (Phase 3-B): build the release binary once here so browser-e2e can
  # download it instead of compiling its own. docker/multiarch still build
  # via Dockerfile to verify the Docker build pipeline itself (contract
  # stability — performance must not weaken build verification).
  build-release:
    name: build-release
    runs-on: ubuntu-latest
    needs: rust-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: build-release
      - run: cargo build --locked --release --bin deve-sub
      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binary
          path: target/release/deve-sub
          retention-days: 1

  resource-soak:
    name: real-application-resource-soak
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binary
          path: target/release
      - run: chmod +x target/release/deve-sub
      - run: python3 scripts/perf/soak.py --binary target/release/deve-sub --seconds 90 --require-telemetry --output /tmp/soak.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: resource-soak
          path: /tmp/soak.*
          retention-days: 7

  supply-chain:
    name: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-deny
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked check

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    needs: [rust-gate, web-wasm, build-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # WHY (Phase 3-A/B): download pre-built WASM dist + release binary
      # instead of compiling them here. Saves ~5m (dioxus install + WASM
      # build + cargo build --release). E2E's global-setup.ts finds them
      # at the default paths (target/release/deve-sub, apps/web/dist).
      - name: Download WASM dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-dist
          path: apps/web/dist
      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binary
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/deve-sub
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Run E2E tests
        run: npx playwright test --reporter=list
        working-directory: tests/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: rust-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Docker image
        # WHY (Phase 3-F): use buildx with GHA cache to reuse Docker layers
        # from multiarch (same Dockerfile). On cold cache this matches plain
        # docker build speed; on warm cache the builder stage (cargo build +
        # WASM build) is fully cached, cutting ~10m.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: deve-sub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and verify health
        run: |
          docker volume create deve-sub-ci-data

          # The image entrypoint runs migrate then serve (DS-AUD-007),
          # so a single docker run is sufficient — no separate migrate step.
          docker run -d --name deve-sub-test -p 8080:8080 -v deve-sub-ci-data:/app/data deve-sub:ci

          # Poll the Docker healthcheck status until healthy
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' deve-sub-test 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy"
              break
            fi
            echo "Waiting for healthy state (attempt $i: $status)..."
            sleep 1
          done

          if [ "$status" != "healthy" ]; then
            echo "FAIL: container did not become healthy within 30s"
            docker logs deve-sub-test
            exit 1
          fi

          # Verify both health endpoints
          curl -sf http://localhost:8080/health/live
          curl -sf http://localhost:8080/health/ready

          # Verify the real frontend is served, not the placeholder (DS-AUD-004).
          # The real dist references the WASM JS bundle; the placeholder does not.
          curl -sf http://localhost:8080/ | grep -q 'deve-sub-web' || {
            echo "FAIL: root page does not reference the WASM bundle — placeholder served"
            docker logs deve-sub-test
            exit 1
          }
          echo "Real frontend is served"

          # Verify non-root user
          uid=$(docker exec deve-sub-test id -u)
          if [ "$uid" != "1000" ]; then
            echo "FAIL: container runs as UID $uid, expected 1000"
            exit 1
          fi
          echo "Container runs as non-root user (UID 1000)"
      - name: Cleanup
        if: always()
        run: |
          docker stop deve-sub-test 2>/dev/null || true
          docker rm deve-sub-test 2>/dev/null || true
          docker volume rm deve-sub-ci-data 2>/dev/null || true

  # Multi-arch build verification (DEPLOY-003/004).
  # WHY: runs on push to main and on the nightly schedule, not on PRs.
  # The arm64 runtime stage still needs QEMU for apt-get on
  # debian:trixie-slim; the builder stage uses cross-compile (not QEMU) per
  # Dockerfile line 9 --platform=$BUILDPLATFORM. Schedule inclusion keeps
  # the arm64 GHA Docker layers warm — the docker job reuses this cache and
  # only multiarch writes arm64 layers.
  multiarch:
    name: multiarch (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: rust-gate
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build multi-arch images (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: deve-sub:multiarch
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64 image from cache
        # WHY (Phase 3-C): step 1 already built amd64+arm64 and wrote to GHA
        # cache. Loading from cache avoids a redundant full docker build
        # (the old step did `docker build` from scratch — ~3-5m wasted).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: deve-sub-amd64
          cache-from: type=gha
      - name: Verify amd64 image boots and healthcheck passes
        run: |
          docker volume create deve-sub-ma-amd64
          # The image entrypoint runs migrate then serve (DS-AUD-007).
          docker run -d --name deve-sub-ma-amd64 -p 8081:8080 \
            -v deve-sub-ma-amd64:/app/data --platform linux/amd64 deve-sub-amd64
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' deve-sub-ma-amd64 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          if [ "$status" != "healthy" ]; then
            echo "FAIL: amd64 container did not become healthy"
            docker logs deve-sub-ma-amd64
            exit 1
          fi
          echo "amd64 healthcheck: healthy (DEPLOY-003/005)"
          docker stop deve-sub-ma-amd64 2>/dev/null || true
          docker rm deve-sub-ma-amd64 2>/dev/null || true
          docker volume rm deve-sub-ma-amd64 2>/dev/null || true
