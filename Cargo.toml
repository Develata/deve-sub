[workspace]
members = [
    "apps/server",
    "apps/cli",
    "apps/web",
    "crates/deve-sub-kernel",
    "crates/deve-sub-contract",
    "crates/deve-sub-domain",
    "crates/deve-sub-application",
    "crates/deve-sub-storage-sqlite",
    "crates/deve-sub-security",
    "crates/deve-sub-observability",
    "crates/deve-sub-inmemory",
    "crates/deve-sub-protocol",
    "crates/deve-sub-emitter",
    "crates/deve-sub-compatibility",
    "crates/deve-sub-adapters",
]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Deve Sub contributors"]
license = "MIT"
repository = "https://github.com/Develata/deve-sub"
homepage = "https://github.com/Develata/deve-sub"

[workspace.dependencies]
# Intra-workspace
deve-sub-kernel = { path = "crates/deve-sub-kernel" }
deve-sub-contract = { path = "crates/deve-sub-contract" }
deve-sub-domain = { path = "crates/deve-sub-domain" }
deve-sub-application = { path = "crates/deve-sub-application" }
deve-sub-storage-sqlite = { path = "crates/deve-sub-storage-sqlite" }
deve-sub-security = { path = "crates/deve-sub-security" }
deve-sub-observability = { path = "crates/deve-sub-observability" }
deve-sub-inmemory = { path = "crates/deve-sub-inmemory" }
deve-sub-protocol = { path = "crates/deve-sub-protocol" }
deve-sub-emitter = { path = "crates/deve-sub-emitter" }
deve-sub-compatibility = { path = "crates/deve-sub-compatibility" }
deve-sub-adapters = { path = "crates/deve-sub-adapters" }
deve-sub-server = { path = "apps/server" }
deve-sub-web = { path = "apps/web" }

# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
proptest = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "request-id"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
tempfile = "3"
argon2 = "0.5"
rand = "0.8"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
async-trait = "0.1"
base64 = "0.22"
sha1 = "0.11"
chacha20poly1305 = "0.10"
data-encoding = "2"
url = "2"
percent-encoding = "2"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "deflate", "brotli", "zstd", "stream", "rustls-tls"] }
maxminddb = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
